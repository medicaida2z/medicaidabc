<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedicaidABC v2.3 | Pennsylvania Long-Term Care & Medicaid Navigation</title>
  <style>
    :root {
      --bg-color: #fcfbf9;
      --card-bg: #ffffff;
      --text-main: #111827;
      --text-muted: #4b5563;
      --border-color: #d1d5db;
      --primary-orange: #c2410c;
      --primary-dark: #0f172a;
      --success: #16a34a;
    }

    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      line-height: 1.5;
    }

    .preview-bar {
      background: #0f172a;
      color: #94a3b8;
      font-size: 0.75rem;
      text-align: center;
      padding: 0.35rem 1rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    header {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }
    .logo span { color: var(--primary-orange); }
    nav {
      display: flex;
      gap: 1.75rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
    }
    nav a { text-decoration: none; color: inherit; }
    nav a:hover { color: var(--text-main); }

    .hero {
      max-width: 900px;
      margin: 2.5rem auto 3rem;
      padding: 0 1.5rem;
      text-align: left;
    }
    .hero-subtitle-tag {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--primary-orange);
      margin-bottom: 0.75rem;
      display: block;
    }
    .hero h1 {
      font-size: 3rem;
      line-height: 1.15;
      margin: 0 0 1.25rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .hero h1 span { color: var(--primary-orange); }
    .hero p {
      font-size: 1.15rem;
      color: var(--text-muted);
      margin: 0 0 0.5rem;
    }
    .disclaimer {
      font-size: 0.78rem;
      color: #6b7280;
      margin-top: 1rem;
    }

    .grid-3 {
      max-width: 1200px;
      margin: 0 auto 3rem;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    
    .card-badge {
      position: absolute;
      top: 1.75rem;
      right: 1.75rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary-orange);
      background: #ffedd5;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
    }

    .card-num {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary-orange);
      margin-bottom: 0.5rem;
    }
    .card h3 {
      font-size: 1.4rem;
      margin: 0 0 0.75rem;
      font-weight: 700;
      color: var(--text-main);
    }
    .card p {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin: 0 0 1.5rem;
      line-height: 1.5;
      flex-grow: 1;
    }

    .btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: #ffffff;
      color: var(--text-main);
      transition: all 0.2s;
    }
    .btn:hover { background: #f3f4f6; }
    
    .btn-dark {
      background: var(--primary-dark);
      color: #ffffff;
      border-color: var(--primary-dark);
    }
    .btn-dark:hover { background: #1e293b; }

    .btn-orange {
      background: #ea580c;
      color: #ffffff;
      border-color: #ea580c;
    }
    .btn-orange:hover { background: #c2410c; }

    #ltc-checklist-panel {
      display: none;
      max-width: 900px;
      margin: 2rem auto 4rem;
      padding: 2.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .checklist-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 1rem;
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .checklist-header h2 { margin: 0; font-size: 1.5rem; color: var(--text-main); }
    .checklist-sub { margin: 0.3rem 0 0; font-size: 0.9rem; color: var(--text-muted); }
    
    .progress-wrap { background: #e5e7eb; border-radius: 999px; height: 10px; margin-bottom: 0.4rem; overflow: hidden; }
    .progress-fill { background: var(--success); height: 100%; width: 0%; transition: width 0.25s ease; }
    .progress-label { font-size: 0.85rem; font-weight: 600; color: #374151; margin-bottom: 1.75rem; display: block; }

    .checklist-category {
      margin-top: 1.75rem;
      margin-bottom: 0.75rem;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary-orange);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .checklist-item {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      padding: 0.75rem 0.5rem;
      border-bottom: 1px solid #f3f4f6;
      cursor: pointer;
    }
    .checklist-item:hover { background: #f9fafb; }
    .checklist-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-top: 2px;
      accent-color: var(--success);
      cursor: pointer;
      flex-shrink: 0;
    }
    .checklist-text strong { display: block; font-size: 0.96rem; color: var(--text-main); font-weight: 600; }
    .checklist-item.checked .checklist-text strong { text-decoration: line-through; color: var(--text-muted); }
    .checklist-note { display: block; font-size: 0.83rem; color: var(--text-muted); margin-top: 0.25rem; }

    .trust-footer {
      max-width: 900px;
      margin: 0 auto 4rem;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .trust-bullet { display: flex; align-items: flex-start; gap: 0.5rem; }
    .trust-bullet span { color: var(--success); font-weight: bold; }

    @media print {
      body * { visibility: hidden; }
      #ltc-checklist-panel, #ltc-checklist-panel * { visibility: visible; }
      #ltc-checklist-panel { position: absolute; left: 0; top: 0; width: 100%; border: none; box-shadow: none; margin: 0; padding: 1rem; }
      .btn-print { display: none; }
    }
  </style>
</head>
<body>

  <div class="preview-bar">PRIVATE PREVIEW (v2.3) • Single-Page Pennsylvania Long-Term Care Assessment</div>

  <header>
    <div class="logo">Medicaid<span>ABC</span></div>
    <nav>
      <a href="#">Three Ways to Start
