<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MedicaidABC | Pennsylvania Long-Term Care Medicaid Help</title>
  <meta name="description" content="A clearer starting point for Pennsylvania long-term care Medicaid applications. A free online assessment, optional $100 attorney chat and a proposed $5,000 application package.">
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root{--navy:#142f38;--muted:#53656a;--orange:#dc5432;--paper:#faf8f2;--line:#d8dedb;--mint:#e9f0e9}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:24px}
    body{margin:0;background:var(--paper);color:var(--navy);font:17px/1.6 Arial,Helvetica,sans-serif}
    a{color:inherit}
    button,input,select{font:inherit}
    button,a{touch-action:manipulation}
    button{cursor:pointer}
    .wrap{max-width:1160px;margin:auto;padding:0 32px}
    .preview{background:var(--navy);color:white;text-align:center;padding:7px 18px;font-size:12px;letter-spacing:.3px}
    header{display:flex;align-items:center;justify-content:space-between;min-height:100px;border-bottom:1px solid var(--line);gap:20px}
    .brand{text-decoration:none;font-size:28px;font-weight:800;letter-spacing:-1.2px}
    .brand span{color:var(--orange)}
    nav{display:flex;gap:28px;font-size:14px;font-weight:bold}
    nav a{text-decoration:none}
    nav a:hover{text-decoration:underline}
    .eyebrow{font-size:12px;letter-spacing:1.8px;text-transform:uppercase;font-weight:800}
    .orange{color:var(--orange)}
    .hero{display:grid;grid-template-columns:1.35fr .8fr;gap:70px;padding:65px 0 52px;align-items:center}
    h1{font:normal clamp(42px,4.6vw,62px)/1.08 Georgia,serif;letter-spacing:-2px;margin:20px 0 24px;max-width:660px}
    h1 em{color:var(--orange);font-style:normal}
    .lead{color:var(--muted);font-size:19px;max-width:580px;margin:0 0 27px}
    .hero-actions{display:flex;gap:14px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;gap:10px;background:var(--navy);color:white;text-decoration:none;padding:15px 25px;border-radius:6px;font-size:15px;font-weight:bold;border:2px solid var(--navy)}
    .btn:hover{background:#0f232a}
    .btn-outline{background:transparent;color:var(--navy)}
    .btn-outline:hover{background:rgba(20,47,56,.06)}
    .fine{font-size:13px;color:var(--muted);margin-top:16px}
    .start-card{background:white;border:1.5px solid var(--navy);border-radius:10px;padding:34px;box-shadow:8px 8px 0 #e4eadd}
    .start-card h2{font:normal 31px/1.16 Georgia,serif;margin:0 0 12px}
    .start-card p{color:var(--muted);font-size:15px;margin:0 0 22px}
    .offer-row{border-top:1px solid var(--line);padding:14px 0;display:flex;justify-content:space-between;align-items:baseline;gap:14px}
    .offer-row strong{font-size:15px}
    .offer-row span{font-size:13px;color:var(--muted)}
    .offer-price{font-weight:800;color:var(--orange);white-space:nowrap}
    .ribbon{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;padding:24px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px;font-weight:bold;color:var(--muted)}
    .ribbon span{display:flex;align-items:center;gap:9px}
    .ribbon b{color:var(--orange);font-size:16px}
    .section{padding:72px 0;border-bottom:1px solid var(--line)}
    .section-head{display:flex;justify-content:space-between;align-items:end;gap:40px;margin-bottom:42px}
    h2{font:normal clamp(30px,3.2vw,42px)/1.12 Georgia,serif;letter-spacing:-1px;margin:10px 0 0;max-width:560px}
    .section-head p{color:var(--muted);max-width:440px;margin:0;font-size:15px}
    .wizard{background:white;border:1.5px solid var(--navy);border-radius:12px;overflow:hidden;box-shadow:8px 8px 0 #e4eadd}
    .wizard-top{background:var(--navy);color:white;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
    .wizard-top strong{font-size:14px;letter-spacing:.3px}
    .wizard-top span{font-size:13px;color:#cbd7d8}
    .wizard-body{padding:32px 28px}
    .wizard-q{font:normal 26px/1.25 Georgia,serif;margin:0 0 8px}
    .wizard-sub{color:var(--muted);font-size:15px;margin:0 0 22px}
    .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .choice{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:18px;position:relative}
    .choice:hover{border-color:var(--navy);background:#f3f0e6}
    .choice[aria-pressed="true"]{border-color:var(--orange);background:#fff7f4}
    .choice strong{display:block;font-size:16px;margin-bottom:4px}
    .choice span{display:block;font-size:13px;color:var(--muted);line-height:1.45}
    .choice .arrow{display:inline-block;margin-top:10px;font-size:12px;font-weight:bold;color:var(--orange)}
    .wizard-nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding-top:18px;border-top:1px solid var(--line);gap:12px;flex-wrap:wrap}
    .link-btn{background:none;border:0;color:var(--muted);font-size:14px;font-weight:bold;padding:6px 0;text-decoration:underline}
    .result-box{background:var(--mint);border:1px solid #c5d6c5;border-radius:10px;padding:26px}
    .result-box h3{font:normal 28px/1.2 Georgia,serif;margin:8px 0 10px}
    .result-box p{margin:0 0 16px;color:var(--navy);font-size:15px}
    .result-list{margin:0 0 20px;padding-left:20px;font-size:15px}
    .result-list li{margin:7px 0}
    .checklist-review{background:white;border:1px solid #c5d6c5;border-radius:8px;padding:20px;margin-top:20px}
    .checklist-review h4{margin:0 0 10px;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
    .checklist-review ul{margin:0;padding-left:20px;font-size:15px}
    .checklist-review li{margin:6px 0}
    .consent-row{display:flex;align-items:start;gap:10px;margin:18px 0;font-size:14px;color:var(--navy)}
    .consent-row input{margin-top:4px;width:16px;height:16px;accent-color:var(--orange)}
    .three{display:grid;grid-template-columns:repeat(3,1fr);gap:35px}
    .step{border-top:2px solid var(--navy);padding-top:18px}
    .step .number{font:normal 31px Georgia,serif;color:var(--orange)}
    .step p{color:var(--muted);font-size:15px}
    .package{display:grid;grid-template-columns:1fr 1.1fr;gap:70px;background:var(--navy);color:white;padding:42px;border-radius:12px}
    .package .price{font-size:58px;margin:20px 0}
    .package p{color:#cbd7d8;font-size:15px}
    .package ul{padding:0;list-style:none;margin:0}
    .package li{padding:12px 0;border-bottom:1px solid #ffffff24;font-size:16px}
    .package li:before{content:'✓';color:#d3e6c1;margin-right:13px}
    .package .exclusions{font-size:13px;margin-top:20px;color:#aebfc1}
